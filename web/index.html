<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>协作房间</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-dot"></span>协作房间
    </div>
    <div id="credits" class="credits" title="点击填写剩余积分">
      <span class="credits-label">剩余积分</span>
      <span class="credits-value" id="credits-value">—</span>
      <a class="credits-link" id="credits-link" href="https://www.codebuddy.ai" target="_blank"
         rel="noopener" title="打开官网查看用量">↗</a>
    </div>
    <div class="section-title">群聊</div>
    <div id="room-list" class="room-list"></div>
    <button id="btn-new-room" class="btn-ghost wide">+ 新建群聊</button>

    <div class="section-title" style="margin-top:14px">单聊</div>
    <div id="dm-list" class="room-list"></div>
    <button id="btn-new-dm" class="btn-ghost wide">+ 新建单聊</button>
    <div class="sidebar-footer">
      <span id="conn-dot" class="dot off"></span>
      <span id="conn-text">连接中…</span>
    </div>
  </aside>

  <main class="chat">
    <header class="chat-header">
      <select id="room-select" class="room-select"></select>
      <div class="head-main">
        <h1 id="room-title">主群</h1>
        <span id="room-meta" class="meta"></span>
      </div>
      <span class="spacer"></span>
      <button id="btn-expand-side" class="btn-ghost hidden" title="展开侧栏">成员</button>
      <button id="btn-project" class="btn-ghost">项目</button>
      <button id="btn-files" class="btn-ghost">文件</button>
      <button id="btn-theme" class="btn-ghost" title="切换主题：跟随系统 / 浅色 / 深色">跟随系统</button>
      <button id="btn-new-room-top" class="btn-ghost">+ 群聊</button>
    </header>
    <div id="mobile-members" class="mobile-members"></div>
    <div id="messages" class="messages"></div>
    <div id="select-bar" class="select-bar hidden">
      <span id="select-count">已选 0 条</span>
      <button id="btn-select-all" class="mini-btn">全选</button>
      <span class="spacer"></span>
      <button id="btn-delete-msgs" class="btn-danger">删除</button>
      <button id="btn-cancel-select" class="btn-ghost">取消</button>
    </div>
    <div id="working-bar" class="working-bar hidden"></div>
    <div class="composer">
      <div id="mention-pop" class="mention-pop hidden"></div>
      <div class="composer-main">
        <div id="attach-strip" class="attach-strip hidden"></div>
        <div class="composer-row">
          <textarea id="input" rows="2" placeholder="输入消息，@ 选人；可粘贴图片或拖入文件"></textarea>
          <button id="btn-attach" class="btn-ghost attach-btn" title="上传图片或文件（也可以直接粘贴、拖进来）">附件</button>
          <button id="btn-send">发送</button>
        </div>
      </div>
      <input id="file-input" type="file" multiple hidden>
    </div>
  </main>

  <aside class="members">
    <div class="panel-tabs">
      <button class="panel-tab active" data-rtab="members">成员</button>
      <button class="panel-tab" data-rtab="files">文件</button>
      <span class="spacer"></span>
      <button id="btn-add-member" class="btn-ghost" title="添加成员">+</button>
      <button id="btn-collapse-side" class="btn-ghost" title="收起侧栏">»</button>
    </div>
    <div id="rtab-members" class="panel-body">
      <div id="member-list" class="member-list"></div>
      <div class="hint">点头像插入 @，右键编辑人格或移除</div>
    </div>
    <div id="rtab-files" class="panel-body hidden">
      <div id="side-file-list" class="file-list"></div>
    </div>
  </aside>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h2 id="modal-title">编辑成员</h2>
    <div class="tabs">
      <button class="tab active" data-tab="persona">人格设定</button>
      <button class="tab" data-tab="memory">成员记忆</button>
    </div>

    <div class="tab-panel" id="panel-persona">
      <div class="form">
        <div class="row">
          <label>名字（@ 用这个）<input id="f-name" placeholder="researcher"></label>
          <label>角色<input id="f-role" placeholder="研究员"></label>
        </div>
        <div class="row">
          <label>昵称<input id="f-persona" placeholder="阿研"></label>
          <label>颜色<input id="f-color" type="color" value="#4F46E5"></label>
        </div>
        <div class="row">
          <label>模型（只影响这个成员）
            <select id="f-model"></select>
          </label>
          <label>推理强度 effort
            <select id="f-effort"></select>
          </label>
        </div>
        <label>备用模型（主模型限流 429 时自动切换，逗号分隔）
          <input id="f-fallback" placeholder="glm-5.3, kimi-k3.1-pro">
        </label>
        <label>人格设定（全局生效，跟着这个成员走，换群聊也不变）
          <textarea id="f-prompt" rows="11" placeholder="你叫……&#10;&#10;【性格】…&#10;【职责】…&#10;【说话方式】…"></textarea>
        </label>
      </div>
    </div>

    <div class="tab-panel hidden" id="panel-memory">
      <p class="tip">这个成员在<b>当前群聊</b>里积累的私有记忆，只有它自己看得到。换个群聊就是另一份。</p>
      <textarea id="f-memory" rows="15" placeholder="（还没有记忆，跑几轮任务就会自动积累）"></textarea>
    </div>

    <div class="modal-actions">
      <button id="btn-del" class="btn-danger">彻底删除</button>
      <button id="btn-remove-room" class="btn-ghost">从本群移除</button>
      <span class="spacer"></span>
      <button id="btn-cancel" class="btn-ghost">取消</button>
      <button id="btn-save" class="btn-primary">保存</button>
    </div>
  </div>
</div>

<div id="modal-project" class="modal hidden">
  <div class="modal-card">
    <h2>项目内容</h2>
    <label class="field">项目名（记忆目录名，改它会重命名 Obsidian 里的文件夹）
      <input id="f-project-name" placeholder="比如：硅铁市场调研">
    </label>
    <p class="tip">整个群聊共享，所有成员都会看到。这里写项目背景、目标、约束；对话记录由程序自动追加到文件末尾，不会被覆盖。</p>
    <p class="tip" id="vault-tip"></p>
    <textarea id="f-project" rows="16"></textarea>
    <div class="modal-actions">
      <span class="spacer"></span>
      <button id="btn-project-cancel" class="btn-ghost">取消</button>
      <button id="btn-project-save" class="btn-primary">保存</button>
    </div>
  </div>
</div>

<div id="modal-add" class="modal hidden">
  <div class="modal-card" style="width:min(520px,100%)">
    <h2>添加成员到本群</h2>
    <div class="tabs">
      <button class="tab active" data-addtab="pool">已有成员</button>
      <button class="tab" data-addtab="tpl">模板库</button>
    </div>
    <p class="tip" id="add-tip">从已有成员里勾选加入。人格是全局的，加进来只是建立关联。</p>
    <div id="add-pool" class="add-list"></div>
    <div id="add-tpl" class="add-list hidden"></div>
    <div class="modal-actions">
      <button id="btn-new-in-room" class="btn-ghost">+ 空白新建</button>
      <span class="spacer"></span>
      <button id="btn-add-cancel" class="btn-ghost">取消</button>
      <button id="btn-add-ok" class="btn-primary">加入</button>
    </div>
  </div>
</div>

<div id="modal-pick" class="modal hidden">
  <div class="modal-card" style="width:min(380px,100%)">
    <h2 id="pick-title">选一个成员</h2>
    <div id="pick-list" class="add-list"></div>
    <div class="modal-actions">
      <span class="spacer"></span>
      <button id="pick-cancel" class="btn-ghost">取消</button>
    </div>
  </div>
</div>

<div id="modal-files" class="modal hidden">
  <div class="modal-card" style="width:min(700px,100%)">
    <h2>工作目录文件</h2>
    <p class="tip">成员生成的文件都在这里，点一条直接打开。消息正文里的文件名也可以点。</p>
    <div id="file-list" class="file-list"></div>
    <div class="modal-actions">
      <span class="spacer"></span>
      <button id="files-refresh" class="btn-ghost">刷新</button>
      <button id="files-close" class="btn-ghost">关闭</button>
    </div>
  </div>
</div>

<div id="modal-preview" class="modal hidden">
  <div class="modal-card preview-card">
    <div class="preview-head">
      <div class="preview-title-wrap">
        <h2 id="preview-title">文件</h2>
        <span id="preview-meta" class="preview-meta"></span>
      </div>
      <span class="spacer"></span>
      <button id="preview-open" class="btn-ghost" title="用系统默认程序打开">打开</button>
      <button id="preview-reveal" class="btn-ghost" title="在资源管理器中显示">定位</button>
      <button id="preview-copy" class="btn-ghost" title="复制本地路径">复制路径</button>
      <a id="preview-download" class="btn-ghost" href="#" download title="下载到浏览器默认目录">下载</a>
      <button id="preview-close" class="btn-ghost">关闭</button>
    </div>
    <div id="preview-body" class="preview-body"></div>
  </div>
</div>

<div id="ctx-menu" class="ctx-menu hidden"></div>

<div id="toast" class="toast hidden"></div>
<div id="boot-error" class="boot-error hidden"></div>
<script src="/app.js"></script>
</body>
</html>
